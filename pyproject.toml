[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "shonchoy-backend"
version = "0.1.0"
description = "Shonchoy development core REST API and isolated LangGraph advisor"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.154,<0.155",
  "uvicorn>=0.49,<0.50",
  "pydantic-settings>=2.12,<3",
  "sqlalchemy>=2.0.46,<2.1",
  "psycopg[binary]>=3.3,<4",
  "alembic>=1.18,<2",
  "langgraph>=1.2.16,<1.3",
  "langsmith>=0.14.11,<0.15",
  "pyjwt[crypto]>=2.12,<3",
  "httpx>=0.28,<0.29",
]

[dependency-groups]
dev = [
  "pytest>=9,<10", "httpx>=0.28,<0.29", "ruff>=0.15,<0.16",
  "mypy>=1.19,<2", "pip-audit>=2.10,<3", "bandit>=1.9,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fintrack_core", "src/fintrack_advisor", "src/fintrack_common"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error"]

[tool.ruff]
target-version = "py311"
line-length = 100
cache-dir = "../.local/cache/backend-ruff"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
